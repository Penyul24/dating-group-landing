<style>

body {

  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px 22px 120px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
  background: #211c2c;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 15px 50px rgba(0,0,0,.4);

.cta {

  width: 100%;
  padding: 17px;
  border-radius: 50px;
  background: linear-gradient(135deg, #f35b9b, #d93679);
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
  box-shadow: 0 6px 22px rgba(233,77,131,.3);

.cta:active {
