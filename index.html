
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171522">

<title>Single Mom</title>
<meta name="description" content="Single Mom">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #171522;
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px 22px 120px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
  background: #211c2c;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 15px 50px rgba(0,0,0,.4);
}

.hero {
  height: 290px;
  background:
    linear-gradient(to bottom, transparent 55%, #211c2c 100%),
    url("Screenshot_20261102-192605.jpg")
    center/cover no-repeat;
}

.content {
  padding: 5px 25px 32px;
}

h1 {
  font-size: 30px;
  line-height: 1.2;
  margin-bottom: 25px;
}

.cta-group {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  width: 100%;
  padding: 17px;
  border-radius: 50px;
  background: #ffffff;
  color: #171522;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
  transition: .2s;
}

.cta svg {
  width: 23px;
  height: 23px;
  flex-shrink: 0;
  color: #171522;
}

.cta:active {
  transform: scale(.97);
  background: #eee;
}

</style>
</head>

<body>

<div class="container">

  <div class="hero"></div>

  <div class="content">

    <h1>Single Mom</h1>

    <div class="cta-group">

      <a class="cta whatsapp" href="https://wa.me/">

        </svg>
        WHATSAPP

          <path d="M8 5v14l11-7z"/>
        </svg>

      </a>

    </div>

  </div>

</div>

</body>
</html>
