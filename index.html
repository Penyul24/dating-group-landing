<title>Single Momy</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #f8c6df;
  color: #30212b;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 430px;
  min-height: calc(100dvh - 40px);
  aspect-ratio: 9 / 16;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 35px 30px;
  text-align: center;
}

.profile {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 22px;
}

h1 {
  font-size: 30px;
  margin-bottom: 28px;
  font-weight: bold;
}

.cta-group {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.cta {
  width: 100%;
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #fff;
  color: #17131c;
  border-radius: 50px;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
  transition: .2s;
}

.cta svg {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.cta:active {
  transform: scale(.97);
  background: #eee;
}

@media (max-height: 650px) {
  .profile {
    width: 110px;
    height: 110px;
  }

  h1 {
    margin-bottom: 20px;
  }
}
</style>
</head>
