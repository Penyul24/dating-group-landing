
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8c6df">

<title>Single Mom</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #f8c6df;
  color: #30212b;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 430px;
  aspect-ratio: 9 / 16;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
}

.profile {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 25px;
}

h1 {
  font-size: 32px;
  margin-bottom: 35px;
  font-weight: bold;
}

.cta-group {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.cta {
  width: 100%;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #fff;
  color: #17131c;
  border-radius: 50px;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
  transition: .2s;
}

.cta svg {
  width: 23px;
  height: 23px;
}

.cta:active {
  transform: scale(.97);
}

@media (max-height: 650px) {
  .profile {
    width: 110px;
    height: 110px;
  }
  h1 {
    margin-bottom: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <img
    class="profile"
    src="Screenshot_20261102-192605.jpg"
    alt="Profile"
  >

  <h1>Single Mom</h1>

  <div class="cta-group">

    <a class="cta" href="https://wa.me/">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.2 1.7 6L.2 24l6.4-1.7 5.5 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.1-3.5-8.4Z"/>
      </svg>
      WHATSAPP
    </a>

    <a class="cta"
       href="https://track.chatvideocall.net/s/9a24608a59183?track=usb">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
      VIDEO
    </a>

  </div>

</div>

</body>
</html>
